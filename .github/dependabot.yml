# Zakadi repository standard: Dependabot for @zakadi/node: npm at the root and the
# workflow actions.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # typescript-eslint 8.70 accepts TypeScript below 6.1 only; lift this when it
      # accepts 7.x.
      - dependency-name: typescript
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      # The Node types stay at the engines floor, Node 20, so no newer API slips in.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
