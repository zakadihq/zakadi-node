# Zakadi repository standard: release.yml for @zakadi/node (npm stage and approve, D64).
# CI stages the package through the trusted publisher on a v* tag; a maintainer
# approves with 2FA (npm stage approve <stage-id>). npm runs the prepack script, which
# builds dist/, when it packs the package.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run test:integration

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an npm version that supports trusted publishing
        run: npm install -g npm@latest && npm --version
      - run: npm ci
      - name: Stage the release (trusted publishing; approval with 2FA happens by hand)
        run: npm stage publish --access public
      - name: Show the staged version
        run: |
          name=$(node -p "require('./package.json').name")
          echo "## Staged: $name" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npm stage list "$name" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Approve with: npm stage approve <stage-id> (prompts for 2FA)" >> "$GITHUB_STEP_SUMMARY"
