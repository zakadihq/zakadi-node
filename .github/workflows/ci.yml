# Zakadi repository standard: ci.yml for @zakadi/node (npm). The commands are the ones
# in lefthook.yml, through the package scripts: format (prettier --check .), lint
# (eslint . && tsc --noEmit), test (the unit tests, on Node 24 and on Node 20, the
# engines floor) and test:integration (against a fake API on node:http). The lint job
# ends with the scan (CI only, references/GITHUB.md of the standard): the licence of
# every production dependency, from npm query, against the excluded list of spec 00
# 0.10, then npm audit over the same dependencies.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: scan
        shell: bash
        env:
          EXCLUDED_LICENCES: "(^|[^[:alnum:]])(A?GPL|SSPL|RSAL)|GNU (Affero )?General Public|Server Side Public|Redis Source Available|-NC([^[:alnum:]]|$)|[Nn]on[- ]?[Cc]ommercial|FoxIO"
        run: |
          npm query .prod | jq -r '.[] | "\(.name)@\(.version) \(.license // .licenses // "unknown")"' | tee "$RUNNER_TEMP/licences.txt"
          if grep -E "$EXCLUDED_LICENCES" "$RUNNER_TEMP/licences.txt"; then
            echo "scan: a licence excluded by spec 00 0.10 is listed above" >&2
            exit 1
          fi
          npm audit --omit=dev

  # One job, so branch protection sees the name unit; it runs the suite on both Node
  # versions the package supports.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: npm test on Node 24
        run: npm test
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: npm test on Node 20
        run: npm test

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:integration --if-present
