# Zakadi repository standard: ci.yml for @zakadi/node (npm). The commands are the ones
# in lefthook.yml, through the package scripts: format (prettier --check .), lint
# (eslint . && tsc --noEmit, then the lines of the lint-generated hook job: the OpenAPI
# copy against its pin and src/generated/ against what npm run generate writes from
# it), test (the unit tests, on Node 24 and on Node 20, the engines floor) and
# test:integration (against a fake API on node:http). The lint job ends with the scan
# (CI only, references/GITHUB.md of the standard): the licence of every production
# dependency, from npm query, against the excluded list of spec 00 0.10, then npm audit
# over the same dependencies.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # The OpenAPI copy against its pin (D133), and src/generated/ against what
      # npm run generate writes from it (D84): the lint-generated job of lefthook.yml.
      - name: generated
        run: |
          set -eu
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          git checkout-index --all --prefix="$tmp/index/"
          git checkout-index --all --prefix="$tmp/generated/"
          sh "$tmp/index/scripts/fetch-openapi.sh" --check
          ln -s "$PWD/node_modules" "$tmp/generated/node_modules"
          (cd "$tmp/generated" && npm run --silent generate)
          diff -r "$tmp/index/src/generated" "$tmp/generated/src/generated"
      - name: scan
        shell: bash
        env:
          EXCLUDED_LICENCES: "(^|[^[:alnum:]])(A?GPL|SSPL|RSAL)|GNU (Affero )?General Public|Server Side Public|Redis Source Available|-NC([^[:alnum:]]|$)|[Nn]on[- ]?[Cc]ommercial|FoxIO"
        run: |
          npm query .prod | jq -r '.[] | "\(.name)@\(.version) \(.license // .licenses // "unknown")"' | tee "$RUNNER_TEMP/licences.txt"
          if grep -E "$EXCLUDED_LICENCES" "$RUNNER_TEMP/licences.txt"; then
            echo "scan: a licence excluded by spec 00 0.10 is listed above" >&2
            exit 1
          fi
          npm audit --omit=dev

  # One job, so branch protection sees the name unit; it runs the suite on both Node
  # versions the package supports.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: npm test on Node 24
        run: npm test
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: npm test on Node 20
        run: npm test

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:integration --if-present
