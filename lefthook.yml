# Zakadi repository standard: git hooks (lefthook 2.x) for @zakadi/node.
# These are the commands .github/workflows/ci.yml runs; a change here is a change there.
# Install: npm ci (the lefthook devDependency's postinstall installs the hooks), or
# lefthook install.

pre-commit:
  jobs:
    - name: ascii
      run: '! LC_ALL=C grep -nHI "[^[:print:][:space:]]" {staged_files}'
    - name: secrets
      glob: "{.env*,**/.env*}"
      run: 'echo "secrets: {staged_files} must not be committed (spec 00 0.11)" >&2; exit 1'
    - name: checks
      group:
        parallel: true
        jobs:
          - name: format
            glob: "*.{ts,tsx,js,mjs,cjs,json,md,yml,yaml}"
            run: npx --no -- prettier --check {staged_files}
          - name: lint
            glob: "*.{ts,tsx,js,mjs,cjs}"
            run: npx --no -- eslint {staged_files}
          # The OpenAPI copy against its pin, and src/generated/ against what
          # npm run generate writes from it (D84, D133), both as staged: two copies of
          # the index in a temporary directory, so the tree is never written.
          - name: lint-generated
            run: |
              set -eu
              tmp="$(mktemp -d)"
              trap 'rm -rf "$tmp"' EXIT
              git checkout-index --all --prefix="$tmp/index/"
              git checkout-index --all --prefix="$tmp/generated/"
              sh "$tmp/index/scripts/fetch-openapi.sh" --check
              ln -s "$PWD/node_modules" "$tmp/generated/node_modules"
              (cd "$tmp/generated" && npm run --silent generate)
              diff -r "$tmp/index/src/generated" "$tmp/generated/src/generated"

commit-msg:
  # git writes the message on merge and rebase.
  skip:
    - merge
    - rebase
  jobs:
    # Signed-off-by is the one trailer admitted, never required. The trailers are the
    # ones git reads in a commit message: a last paragraph of Key: value lines.
    - name: message
      run: |
        f="{1}"
        if LC_ALL=C grep -nH "[^[:print:][:space:]]" "$f"; then
          echo "commit message: ASCII only" >&2; exit 1
        fi
        if grep -iEq "^(co-authored-by|claude-session|generated-by):|claude\.ai/code|generated by" "$f"; then
          echo "commit message: no attribution trailer or footer" >&2; exit 1
        fi
        if git interpret-trailers --parse --no-divider "$f" | grep -viE "^signed-off-by:"; then
          echo "commit message: Signed-off-by is the only trailer" >&2; exit 1
        fi
        if [ "$(head -n 1 "$f" | wc -c)" -gt 73 ]; then
          echo "commit message: subject over 72 characters" >&2; exit 1
        fi

pre-push:
  jobs:
    - name: types
      run: npx --no -- tsc --noEmit
    - name: unit
      run: npm test
